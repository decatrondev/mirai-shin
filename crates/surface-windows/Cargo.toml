[package]
name = "miraishin-surface-windows"
description = "Fondo en Windows: una ventana por monitor detrás de los íconos del escritorio, imágenes con GDI y video con libmpv"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
miraishin-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
miraishin-brand = { workspace = true }
miraishin-render-video = { workspace = true }
tracing = { workspace = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
