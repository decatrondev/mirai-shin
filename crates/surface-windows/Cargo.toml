[package]
name = "miraishin-surface-windows"
description = "Fondo en Windows: una ventana por monitor detrás de los íconos del escritorio, dibujada con GDI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
miraishin-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
miraishin-brand = { workspace = true }
tracing = { workspace = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
