[package]
name = "miraishin-win-video-probe"
description = "Prueba mínima (fase 2.8): video con libmpv en la ventana layered del escritorio de Windows, con OpenGL propio (A) o con la ventana de mpv (B). No se distribuye"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "miraishin-win-video-probe"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
miraishin-core = { workspace = true }
miraishin-render-video = { workspace = true }
miraishin-surface-windows = { workspace = true }
tracing-subscriber = { workspace = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
