# Flatpak de DESARROLLO (fases 1 y 2): daemon, ctl, la prueba de capa de fondo y libmpv.
# Para Flathub (fase 6) se cambia la compilación con red por fuentes fijas (cargo-sources.json).
id: net.decatron.MiraiShin
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: miraishin-daemon
finish-args:
  # Sin red ni acceso a carpetas personales (los fondos van en la carpeta de la app).
  - --socket=wayland
  # KDE: pasarle los cuadros a Plasma (org.kde.PlasmaShell.evaluateScript) e instalar el
  # complemento de fondo; solo esa carpeta de Plasma, nada más de ~/.local/share.
  - --talk-name=org.kde.plasmashell
  - --filesystem=xdg-data/plasma/wallpapers:create
  # Video en Sway/Hyprland (fase 2): la GPU para dibujar (EGL) y decodificar (VA-API).
  - --device=dri
  # Pausar el video con batería (3.2), al bloquear y al suspender (3.4): solo leer UPower y
  # logind en el bus de sistema.
  - --system-talk-name=org.freedesktop.UPower
  - --system-talk-name=org.freedesktop.login1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/miraishin/cargo
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'
modules:
  # ---- Video (fase 2.5): todo LGPL. El FFmpeg del runtime no trae H.264/HEVC y el de
  # codecs-extra es GPL, así que va uno propio: decodificar, más VP9 con libvpx (BSD, del
  # runtime) para las copias.
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      # Solo el programa ffmpeg: el daemon lo usa para crear la copia VP9 de un video que
      # este equipo no puede reproducir (fase 2.9). Codificador y salida, solo VP9/WebM.
      - --disable-ffplay
      - --disable-ffprobe
      - --disable-doc
      - --disable-encoders
      - --enable-encoder=libvpx_vp9
      - --enable-libvpx
      - --disable-muxers
      - --enable-muxer=webm
      - --disable-avdevice
      - --disable-network
      - --disable-sdl2
      - --disable-xlib
      - --disable-libxcb
      - --disable-vdpau
      - --enable-vaapi
      - --enable-libdrm
      - --enable-libdav1d
    post-install:
      - install -Dm644 -t /app/share/licenses/${FLATPAK_ID}/ffmpeg LICENSE.md COPYING.LGPLv2.1
    cleanup:
      - /share/ffmpeg
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.2.tar.xz
        sha256: 089bc60fb59d6aecc5d994ff530fd0dcb3ee39aa55867849a2bbc4e555f9c304

  - name: libass
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dtest=disabled
      - -Dprofile=disabled
      - -Dfontconfig=enabled
    post-install:
      - install -Dm644 -t /app/share/licenses/${FLATPAK_ID}/libass ../COPYING
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.4
        commit: bbb3c7f1570a4a021e52683f3fbdf74fe492ae84

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dopengl=enabled
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
      - -Dd3d11=disabled
      - -Ddemos=false
      - -Dtests=false
      - -Dlcms=enabled
    post-install:
      - install -Dm644 -t /app/share/licenses/${FLATPAK_ID}/libplacebo ../LICENSE
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.387.0
        commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65

  # mpv la pide con drm (necesario para VA-API por /dev/dri). MIT.
  - name: libdisplay-info
    buildsystem: meson
    cleanup:
      - /bin
    config-opts:
      - --libdir=lib
    post-install:
      - install -Dm644 -t /app/share/licenses/${FLATPAK_ID}/libdisplay-info ../LICENSE
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/emersion/libdisplay-info.git
        tag: 0.4.0
        commit: c67a3e9bedb05ab61c7443704a1a107e76254595

  - name: mpv
    buildsystem: meson
    config-opts:
      - --libdir=lib
      # LGPL: sin los archivos solo-GPL de mpv.
      - -Dgpl=false
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dauto_features=disabled
      - -Dgl=enabled
      - -Degl=enabled
      - -Dwayland=enabled
      - -Degl-wayland=enabled
      - -Ddrm=enabled
      - -Dvaapi=enabled
      - -Dvaapi-drm=enabled
      - -Dvaapi-wayland=enabled
      - -Dzlib=enabled
      - -Diconv=enabled
      - -Dlcms2=enabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
    post-install:
      - install -Dm644 -t /app/share/licenses/${FLATPAK_ID}/mpv ../LICENSE.LGPL ../Copyright
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413

  - name: miraishin
    buildsystem: simple
    build-options:
      # Solo en desarrollo: deja a cargo bajar las dependencias.
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --locked -p miraishin-daemon -p miraishin-ctl -p miraishin-layer-probe
      - install -Dm755 target/release/miraishin-daemon -t /app/bin
      - install -Dm755 target/release/miraishin-ctl -t /app/bin
      - install -Dm755 target/release/miraishin-layer-probe -t /app/bin
      - install -Dm644 -t /app/share/licenses/${FLATPAK_ID} LICENSE LICENSE-EXCEPTION.md
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - node_modules
          - .git
          - .dev
          - preview
          # Secretos del panel: nunca dentro de un paquete.
          - services/web/.env
          - apps/landing
          - packaging/flatpak/build
          - packaging/flatpak/repo
          - packaging/flatpak/.flatpak-builder
