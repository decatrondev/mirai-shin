name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run check:brand
      - run: npm run typecheck
      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux es la plataforma principal; Windows debe compilar y pasar pruebas desde la fase 0.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # libmpv para la prueba de video (render-video la carga al arrancar; no hace falta para
      # compilar). En Windows el video llega al final de la fase 2.
      - name: libmpv
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv2
      - run: cargo fmt --all --check
      # miraishin-web es el servidor del panel de la landing: solo corre en Linux.
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets $([ "$RUNNER_OS" = Windows ] && echo --exclude miraishin-web) -- -D warnings
      - name: Pruebas
        shell: bash
        run: cargo test --workspace $([ "$RUNNER_OS" = Windows ] && echo --exclude miraishin-web)
      # Paquete de prueba para Windows (fase 1.8): daemon y ctl en release, como artefacto.
      # El CI no tiene escritorio real; el fondo se prueba en un Windows de verdad.
      - name: Compilar exe de Windows
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: bash
        run: |
          cargo build --release -p miraishin-daemon -p miraishin-ctl
          # El manifiesto (DPI por monitor y Windows 8+) tiene que ir dentro del exe.
          grep -q PerMonitorV2 target/release/miraishin-daemon.exe
      # libmpv LGPL con sus DLL, ffmpeg.exe y licencias (fase 2.8): la compila el flujo
      # `windows-libmpv.yml` y la deja en caché con esta misma clave. Si su script acaba de
      # cambiar y todavía no terminó, el paquete sale sin video (aviso) y basta con volver a
      # correr este trabajo.
      - uses: actions/cache/restore@v4
        if: runner.os == 'Windows' && github.event_name == 'push'
        id: libmpv
        with:
          path: packaging/windows/dist
          key: libmpv-${{ hashFiles('packaging/windows/build-libmpv.sh') }}
      - name: Armar paquete de Windows
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p package/licenses
          cp target/release/miraishin-daemon.exe target/release/miraishin-ctl.exe package/
          cp LICENSE LICENSE-EXCEPTION.md package/licenses/
          if [ -f packaging/windows/dist/libmpv-2.dll ]; then
            cp -r packaging/windows/dist/. package/
          else
            echo "::warning::Sin libmpv en caché: el paquete sale sin video. Espera a «libmpv para Windows» y vuelve a correr este trabajo."
          fi
          ls package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && github.event_name == 'push'
        with:
          name: windows-x64
          path: package
          retention-days: 14
