name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run check:brand
      - run: npm run typecheck
      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux es la plataforma principal; Windows debe compilar y pasar pruebas desde la fase 0.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # libmpv para la prueba de video (render-video la carga al arrancar; no hace falta para
      # compilar). En Windows el video llega al final de la fase 2.
      - name: libmpv
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv2
      - run: cargo fmt --all --check
      # miraishin-web es el servidor del panel de la landing: solo corre en Linux.
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets $([ "$RUNNER_OS" = Windows ] && echo --exclude miraishin-web) -- -D warnings
      - name: Pruebas
        shell: bash
        run: cargo test --workspace $([ "$RUNNER_OS" = Windows ] && echo --exclude miraishin-web)
      # Paquete de prueba para Windows (fase 1.8): daemon y ctl en release, como artefacto.
      # El CI no tiene escritorio real; el fondo se prueba en un Windows de verdad.
      - name: Compilar exe de Windows
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: bash
        run: |
          cargo build --release -p miraishin-daemon -p miraishin-ctl
          # El manifiesto (DPI por monitor y Windows 8+) tiene que ir dentro del exe.
          grep -q PerMonitorV2 target/release/miraishin-daemon.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && github.event_name == 'push'
        with:
          name: windows-x64
          path: |
            target/release/miraishin-daemon.exe
            target/release/miraishin-ctl.exe
          retention-days: 14
      # Prueba mínima del 2.8 (no se distribuye): video con libmpv en la ventana layered.
      # La libmpv LGPL es la de zhongfly/mpv-winbuild, fijada por versión y hash, SOLO para
      # esta prueba; la que se distribuya se compila en este CI con versiones fijas.
      - name: Prueba de video en Windows (2.8)
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: bash
        run: |
          cargo build --release -p miraishin-win-video-probe
          grep -q PerMonitorV2 target/release/miraishin-win-video-probe.exe
          name=mpv-dev-lgpl-x86_64-20261101-git-add72571ea.7z
          curl -sSfLO "https://github.com/zhongfly/mpv-winbuild/releases/download/2026-11-01-add72571ea/$name"
          echo "a05f80aa36faecc25af840dca3a24af0cd32fa42a114bf7ea91dc21a80376f6c  $name" | sha256sum -c
          mkdir -p probe && 7z x -oprobe/mpv "$name" > /dev/null
          ls -la probe/mpv
          cp probe/mpv/libmpv-2.dll target/release/miraishin-win-video-probe.exe probe/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && github.event_name == 'push'
        with:
          name: windows-video-probe
          path: |
            probe/miraishin-win-video-probe.exe
            probe/libmpv-2.dll
          retention-days: 14
